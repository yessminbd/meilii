<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#ff5a86"/>
      <stop offset="0.5" stop-color="#e80b4a"/>
      <stop offset="1" stop-color="#7d0a33"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fff2f5" stop-opacity="0.75"/>
      <stop offset="0.55" stop-color="#ff9db8" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#ff9db8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bagMain" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#ffd9e3"/>
    </linearGradient>
    <linearGradient id="bagSmall" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffb3c8"/>
      <stop offset="1" stop-color="#ff5a86"/>
    </linearGradient>
    <linearGradient id="heart" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff3d71"/>
      <stop offset="1" stop-color="#d1003f"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe08a"/>
      <stop offset="1" stop-color="#ffa51f"/>
    </linearGradient>
    <filter id="blur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#4a0020" flood-opacity="0.35"/>
    </filter>
    <pattern id="dots" width="44" height="44" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.6" fill="#ffffff" fill-opacity="0.16"/>
    </pattern>
    <symbol id="spark" viewBox="-20 -20 40 40">
      <path d="M0 -20 C2 -6 6 -2 20 0 C6 2 2 6 0 20 C-2 6 -6 2 -20 0 C-6 -2 -2 -6 0 -20 Z"/>
    </symbol>
    <symbol id="hrt" viewBox="0 0 100 90">
      <path d="M50 88 C10 58 -8 28 16 10 C32 -2 48 8 50 22 C52 8 68 -2 84 10 C108 28 90 58 50 88 Z"/>
    </symbol>
  </defs>

  <!-- Background -->
  <rect width="1000" height="1000" fill="url(#bg)"/>
  <rect width="1000" height="1000" fill="url(#dots)"/>
  <circle cx="900" cy="120" r="330" fill="#ffffff" fill-opacity="0.07"/>
  <circle cx="900" cy="120" r="230" fill="#ffffff" fill-opacity="0.07"/>
  <circle cx="60" cy="760" r="300" fill="#ffffff" fill-opacity="0.05"/>

  <!-- Big faded characters -->
  <text x="500" y="330" text-anchor="middle"
        font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC','Heiti SC',sans-serif"
        font-size="340" font-weight="900" fill="#ffffff" fill-opacity="0.10">美丽</text>

  <!-- Halo + orbit rings -->
  <circle cx="500" cy="560" r="360" fill="url(#halo)"/>
  <ellipse cx="500" cy="580" rx="400" ry="150" fill="none" stroke="#ffffff" stroke-opacity="0.55" stroke-width="3" transform="rotate(-12 500 580)"/>
  <ellipse cx="500" cy="580" rx="430" ry="170" fill="none" stroke="#ffc23d" stroke-opacity="0.7" stroke-width="2" stroke-dasharray="3 12" stroke-linecap="round" transform="rotate(-12 500 580)"/>

  <!-- Podium -->
  <ellipse cx="500" cy="770" rx="360" ry="46" fill="#4a0020" fill-opacity="0.45" filter="url(#blur)"/>
  <ellipse cx="500" cy="752" rx="330" ry="40" fill="#ffffff" fill-opacity="0.16"/>
  <ellipse cx="500" cy="746" rx="300" ry="32" fill="#ffffff" fill-opacity="0.18"/>

  <!-- Gift box (left) -->
  <g filter="url(#soft)">
    <rect x="215" y="610" width="170" height="130" rx="14" fill="url(#gold)"/>
    <rect x="205" y="580" width="190" height="46" rx="12" fill="#ffd36a"/>
    <rect x="285" y="580" width="30" height="160" fill="#e80b4a"/>
    <path d="M300 580 C260 520 210 540 240 575 C260 590 290 585 300 580 Z" fill="#e80b4a"/>
    <path d="M300 580 C340 520 390 540 360 575 C340 590 310 585 300 580 Z" fill="#ff3d71"/>
  </g>

  <!-- Small bag (right, tilted) -->
  <g transform="rotate(9 710 650)" filter="url(#soft)">
    <path d="M640 560 L780 560 L796 735 Q797 750 782 750 L638 750 Q623 750 624 735 Z" fill="url(#bagSmall)"/>
    <path d="M680 560 C680 505 740 505 740 560" fill="none" stroke="#ffe3ea" stroke-width="10" stroke-linecap="round"/>
    <use href="#hrt" x="685" y="630" width="50" height="45" fill="#ffffff" fill-opacity="0.9"/>
  </g>

  <!-- Main bag (center) -->
  <g filter="url(#soft)">
    <path d="M385 440 L615 440 L642 735 Q643 756 622 756 L378 756 Q357 756 358 735 Z" fill="url(#bagMain)"/>
    <path d="M385 440 L615 440 L618 470 L382 470 Z" fill="#ffffff" fill-opacity="0.65"/>
    <path d="M438 442 C438 350 562 350 562 442" fill="none" stroke="#ffffff" stroke-width="16" stroke-linecap="round"/>
    <circle cx="438" cy="450" r="9" fill="#ff8fab"/>
    <circle cx="562" cy="450" r="9" fill="#ff8fab"/>
    <use href="#hrt" x="440" y="535" width="120" height="108" fill="url(#heart)"/>
    <path d="M463 568 C470 556 484 556 490 566" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" opacity="0.6"/>
  </g>

  <!-- Lipstick (right front) -->
  <g transform="rotate(-8 830 680)" filter="url(#soft)">
    <rect x="808" y="640" width="46" height="100" rx="8" fill="#1f1f23"/>
    <rect x="808" y="622" width="46" height="26" rx="4" fill="url(#gold)"/>
    <path d="M814 622 L814 585 Q814 570 826 566 L854 580 L848 622 Z" fill="#ff3d71"/>
    <path d="M820 600 L820 580" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.5"/>
  </g>

  <!-- Cart icon (top-left) -->
  <g fill="none" stroke="#ffffff" stroke-width="11" stroke-linecap="round" stroke-linejoin="round" opacity="0.92" transform="translate(150 330) rotate(-8)">
    <path d="M0 0 H30 L55 105 H150 L172 36 H38"/>
    <circle cx="72" cy="138" r="11" fill="#ffffff" stroke="none"/>
    <circle cx="136" cy="138" r="11" fill="#ffffff" stroke="none"/>
  </g>

  <!-- Floating hearts -->
  <use href="#hrt" x="755" y="330" width="56" height="50" fill="#ffffff" fill-opacity="0.9" transform="rotate(14 783 355)"/>
  <use href="#hrt" x="170" y="470" width="30" height="27" fill="#ffd0dc" fill-opacity="0.9" transform="rotate(-12 185 483)"/>
  <use href="#hrt" x="835" y="470" width="26" height="23" fill="#ffffff" fill-opacity="0.6"/>

  <!-- Gold sparkles -->
  <g fill="#ffc23d">
    <use href="#spark" x="130" y="215" width="54" height="54"/>
    <use href="#spark" x="800" y="205" width="40" height="40"/>
    <use href="#spark" x="880" y="590" width="34" height="34"/>
    <use href="#spark" x="560" y="300" width="30" height="30" fill="#ffffff"/>
    <use href="#spark" x="110" y="640" width="30" height="30" fill="#ffffff"/>
    <circle cx="690" cy="260" r="6"/>
    <circle cx="300" cy="260" r="5" fill="#ffffff"/>
  </g>
</svg>
